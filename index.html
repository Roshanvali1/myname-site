<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Name</title>
  <style>
    :root { --bg: #0f172a; --card: #0b1220; --accent: green; --text: #e6eef8; }
    html,body { height:100%; margin:0; font-family: Inter, system-ui, sans-serif; background: linear-gradient(180deg,var(--bg),#071020); color:var(--text); }
    .wrap { height:100%; display:flex; align-items:center; justify-content:center; }
    .card {
      text-align:center;
      padding:3rem 2.5rem;
      border-radius:18px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.7);
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      min-width:320px;
    }
    h1 { margin:0 0 .5rem 0; font-size:2.4rem; letter-spacing:0.6px; color:pink(--accent); }
    p { margin:0; opacity:0.9; }
    @media (max-width:420px){
      .card { padding:2rem 1.2rem; border-radius:14px; }
      h1 { font-size:1.8rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="main" aria-live="polite">
      <h1>Roshan Vali</h1>
      <p>This is my website — hello 👋</p>
    </div>
  </div>
</body>
</html>
